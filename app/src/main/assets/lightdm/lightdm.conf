[Seat:*]
autologin-user=cyber
autologin-user-timeout=0
user-session=xfce
greeter-session=lightdm-gtk-greeter
session-wrapper=/etc/lightdm/xsession-wrapper
xserver-command=Xwayland
xserver-layout=0
xserver-config=/etc/lightdm/xorg.conf
display-setup-script=/etc/lightdm/display-setup.sh
session-setup-script=/etc/lightdm/session-setup.sh
session-cleanup-script=/etc/lightdm/session-cleanup.sh
autologin-session=xfce
pam-service=lightdm
pam-autologin-service=lightdm-autologin
greeter-hide-users=false
greeter-allow-guest=false
greeter-show-manual-login=false
greeter-show-remote-login=false
allow-guest=false
guest-wrapper=/etc/lightdm/guest-wrapper

[LightDM]
start-default-seat=true
log-directory=/var/log/lightdm
run-directory=/run/lightdm
sessions-directory=/usr/share/lightdm/sessions:/usr/share/xsessions:/usr/share/wayland-sessions
backup-logs=true
log-level=1

[VNCServer]
enabled=false
command=Xvnc
port=5900
listen-address=
width=1024
height=768
depth=24

[XDMCPServer]
enabled=false
port=177
key=

[Greeter]
theme-name=Adwaita
icon-theme-name=Adwaita
font-name=Sans 12
background=/usr/share/backgrounds/xfce/xfce-blue.jpg
clock-format=%H:%M
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power
position=center
show-language-selector=true
show-indicators=true
show-clock=true
show-hostname=true