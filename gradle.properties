# Project-wide Gradle settings
# IDE (e.g. Android Studio) users: settings in this file override IDE settings

# Enable parallel builds
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.workers.max=2

# JVM args for daemon
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Android
android.enableJetifier=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build cache
org.gradle.caching=true

# NDK version (must match installed NDK)
android.ndkVersion=27.0.12077973

# Kotlin
kotlin.code.style=official
kotlin.incremental.compilation=true
kotlin.incremental.useClasspathSnapshot=true

# Disable R8 for debug builds (faster)
android.enableR8.fullMode=false
