# Linux Cyberdeck - Android APK Build Pipeline
# This workflow builds the complete APK including:
# 1. Debian 13 (Trixie) ARM64 rootfs via multistrap (no qemu chroot needed)
# 2. PRoot built with termux-packages approach (known working for Android)
# 3. Native libraries (JNI bridge, supervisor, FUSE storage bridge)
# 4. Final APK assembly

name: Build Linux Cyberdeck APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  ANDROID_SDK_VERSION: '34'
  ANDROID_NDK_VERSION: '27.0.12077973'
  DEBIAN_VERSION: 'trixie'
  DEBIAN_ARCH: 'arm64'

jobs:
  build-rootfs:
    name: Build Debian ARM64 Rootfs (multistrap)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      rootfs_path: ${{ steps.set-outputs.outputs.rootfs_path }}
      rootfs_size: ${{ steps.set-outputs.outputs.rootfs_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install multistrap and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            multistrap \
            qemu-user-static \
            binfmt-support \
            tar \
            gzip \
            xz-utils \
            sudo \
            coreutils \
            util-linux

      - name: Create multistrap config
        run: |
          cat > multistrap.conf << 'EOF'
[General]
arch=arm64
directory=rootfs-arm64
cleanup=true
noauth=true
unpack=true
bootstrap=Debian
aptsources=Debian

[Debian]
packages=bash coreutils util-linux procps iproute2 iputils-ping \
  nano vim-tiny curl wget ca-certificates \
  git python3 python3-pip python3-venv \
  openssh-client openssh-server \
  sudo locales tzdata \
  systemd-sysv dbus \
  xfce4 xfce4-terminal thunar xfce4-panel xfdesktop4 xfwm4 xfce4-settings \
  xfce4-whiskermenu-plugin xfce4-pulseaudio-plugin \
  lightdm lightdm-gtk-greeter \
  dbus-x11 polkitd \
  xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-video-fbdev \
  xvfb xwayland xauth x11-xserver-utils \
  mesa-utils glx-alternative-mesa \
  firefox-esr
source=http://deb.debian.org/debian
suite=trixie
components=main contrib non-free non-free-firmware
keyring=debian-archive-keyring

[Debian-Updates]
packages=
source=http://deb.debian.org/debian
suite=trixie-updates
components=main contrib non-free non-free-firmware

[Debian-Security]
packages=
source=http://security.debian.org/debian-security
suite=trixie-security
components=main contrib non-free non-free-firmware
EOF

      - name: Run multistrap
        run: |
          sudo multistrap -f multistrap.conf -d ${{ runner.temp }}/rootfs-build

      - name: Copy qemu static binary
        run: |
          sudo cp /usr/bin/qemu-aarch64-static ${{ runner.temp }}/rootfs-build/rootfs-arm64/usr/bin/

      - name: Configure rootfs (chroot with qemu)
        run: |
          sudo chroot ${{ runner.temp }}/rootfs-build/rootfs-arm64 /bin/bash << 'CHROOT_EOF'
          # Second stage setup
          /debootstrap/debootstrap --second-stage 2>/dev/null || true
          
          # Configure apt
          cat > /etc/apt/sources.list << 'APT_EOF'
deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
APT_EOF
          
          # Update and install any missing packages
          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-sysv dbus || true
          
          # Create cyber user
          useradd -m -s /bin/bash -G sudo,video,audio,render,plugdev cyber 2>/dev/null || true
          echo "cyber:cyber" | chpasswd
          echo "root:root" | chpasswd
          echo "cyber ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/cyber
          
          # Locale
          sed -i 's/# en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen
          echo 'LANG="en_US.UTF-8"' > /etc/default/locale
          ln -sf /usr/share/zoneinfo/UTC /etc/localtime
          echo "UTC" > /etc/timezone
          
          # Disable services
          systemctl disable bluetooth cups ModemManager avahi-daemon 2>/dev/null || true
          
          # Clean
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -rf /usr/share/doc/*
          rm -rf /usr/share/man/*
          rm -rf /usr/share/locale/*
          find / -name "*.pyc" -delete 2>/dev/null
          find / -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
CHROOT_EOF

      - name: Copy XFCE and LightDM configurations
        run: |
          sudo mkdir -p ${{ runner.temp }}/rootfs-build/rootfs-arm64/home/cyber/.config/xfce4/xfconf/xfce-perchannel-xml
          sudo cp -r app/src/main/assets/xfce-config/* ${{ runner.temp }}/rootfs-build/rootfs-arm64/home/cyber/.config/xfce4/
          sudo mkdir -p ${{ runner.temp }}/rootfs-build/rootfs-arm64/etc/lightdm
          sudo cp -r app/src/main/assets/lightdm/* ${{ runner.temp }}/rootfs-build/rootfs-arm64/etc/lightdm/
          sudo chmod +x ${{ runner.temp }}/rootfs-build/rootfs-arm64/etc/lightdm/*.sh
          sudo chroot ${{ runner.temp }}/rootfs-build/rootfs-arm64 chown -R cyber:cyber /home/cyber

      - name: Create rootfs tarball
        run: |
          mkdir -p ${{ runner.temp }}/artifacts
          cd ${{ runner.temp }}/rootfs-build
          tar -czf ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz rootfs-arm64
          ls -lh ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz
          retention-days: 7

      - name: Set outputs
        id: set-outputs
        run: |
          SIZE=$(stat -c%s ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz)
          echo "rootfs_path=${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz" >> $GITHUB_OUTPUT
          echo "rootfs_size=$SIZE" >> $GITHUB_OUTPUT

  build-proot:
    name: Build PRoot for ARM64 Android (termux approach)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      proot_path: ${{ steps.set-outputs.outputs.proot_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libtalloc-dev \
            libcap-dev \
            libseccomp-dev \
            git \
            python3

      - name: Clone termux-packages (has working PRoot build for Android)
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git ${{ runner.temp }}/termux-packages

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 build-tools;34.0.0 platform-tools platforms;android-26'

      - name: Build PRoot using termux-packages script
        run: |
          cd ${{ runner.temp }}/termux-packages
          
          # Use termux's build script for PRoot
          ./scripts/build-package.sh proot 2>&1 | tee build.log
          
          # Find the built binary
          find . -name "proot" -type f -executable | head -5

      - name: Copy PRoot binary
        run: |
          mkdir -p ${{ runner.temp }}/proot-install/bin
          # Find and copy the built proot binary
          PROOT_BIN=$(find ${{ runner.temp }}/termux-packages -name "proot" -type f -executable | head -1)
          if [ -z "$PROOT_BIN" ]; then
            echo "ERROR: PRoot binary not found"
            find ${{ runner.temp }}/termux-packages -name "proot" -type f
            exit 1
          fi
          cp "$PROOT_BIN" ${{ runner.temp }}/proot-install/bin/proot
          chmod +x ${{ runner.temp }}/proot-install/bin/proot

      - name: Verify PRoot binary
        run: |
          file ${{ runner.temp }}/proot-install/bin/proot
          ${{ runner.temp }}/proot-install/bin/proot --version

      - name: Upload PRoot artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-android-arm64
          path: ${{ runner.temp }}/proot-install/bin/proot
          retention-days: 7

      - name: Set outputs
        id: set-outputs
        run: |
          echo "proot_path=${{ runner.temp }}/proot-install/bin/proot" >> $GITHUB_OUTPUT

  build-native:
    name: Build Native Libraries (JNI + Supervisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [build-proot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PRoot binary
        uses: actions/download-artifact@v4
        with:
          name: proot-android-arm64
          path: ${{ runner.temp }}/proot-bin

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 build-tools;34.0.0 platform-tools platforms;android-26'

      - name: Prepare PRoot for CMake
        run: |
          mkdir -p app/src/main/cpp/proot
          cp ${{ runner.temp }}/proot-bin/proot app/src/main/cpp/proot/
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.22.1)' \
            'project(proot-prebuilt)' \
            '' \
            'add_library(proot STATIC IMPORTED)' \
            'set_target_properties(proot PROPERTIES' \
            '  IMPORTED_LOCATION ${CMAKE_CURRENT_SOURCE_DIR}/proot' \
            '  IMPORTED_LINK_INTERFACE_LIBRARIES ""' \
            ')' > app/src/main/cpp/proot/CMakeLists.txt

      - name: Configure CMake for Android
        run: |
          cd app
          cmake -B build/arm64 -S src/main/cpp \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK=${ANDROID_NDK_HOME} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_NDK_TOOLCHAIN_VERSION=clang

      - name: Build native libraries
        run: |
          cd app
          cmake --build build/arm64 -j$(nproc) --config Release

      - name: Verify native libraries
        run: |
          ls -la app/build/arm64/jniLibs/arm64-v8a/
          file app/build/arm64/jniLibs/arm64-v8a/liblinuxcyberdeck_jni.so

      - name: Upload native libraries artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-arm64
          path: app/build/arm64/jniLibs/arm64-v8a/*.so
          retention-days: 7

  assemble-apk:
    name: Assemble Final APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [build-rootfs, build-proot, build-native]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arm64
          path: app/src/main/assets

      - name: Download PRoot binary
        uses: actions/download-artifact@v4
        with:
          name: proot-android-arm64
          path: app/src/main/assets

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libs-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - name: Verify assets
        run: |
          ls -lh app/src/main/assets/
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 build-tools;34.0.0 platform-tools platforms;android-34'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          unzip -l app/build/outputs/apk/release/app-release.apk | head -30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cyberdeck-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false