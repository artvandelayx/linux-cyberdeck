# Linux Cyberdeck - Android APK Build Pipeline
# Reliable build: cross-compile PRoot directly with Android NDK

name: Build Linux Cyberdeck APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  ANDROID_SDK_VERSION: '34'
  ANDROID_NDK_VERSION: '27.0.12077973'
  DEBIAN_VERSION: 'trixie'
  DEBIAN_ARCH: 'arm64'

jobs:
  build-rootfs:
    name: Build Debian ARM64 Rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      rootfs_path: ${{ steps.set-outputs.outputs.rootfs_path }}
      rootfs_size: ${{ steps.set-outputs.outputs.rootfs_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            tar \
            gzip \
            xz-utils \
            sudo \
            coreutils \
            util-linux

      - name: Enable ARM64 emulation
        run: |
          sudo systemctl restart systemd-binfmt
          sudo update-binfmts --enable qemu-aarch64
          sleep 2

      - name: Create rootfs with debootstrap (single-stage with --include)
        run: |
          mkdir -p ${{ runner.temp }}/rootfs-build
          ROOTFS_DIR="${{ runner.temp }}/rootfs-build/rootfs-arm64"
          
          sudo debootstrap --arch=arm64 --include=bash,coreutils,util-linux,procps,iproute2,ca-certificates,apt \
            trixie "$ROOTFS_DIR" http://deb.debian.org/debian
          
          sudo cp /usr/bin/qemu-aarch64-static "$ROOTFS_DIR/usr/bin/"

      - name: Configure rootfs (chroot with qemu)
        run: |
          ROOTFS_DIR="${{ runner.temp }}/rootfs-build/rootfs-arm64"

          printf 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware\ndeb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware\ndeb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware\n' | sudo tee "$ROOTFS_DIR/etc/apt/sources.list" > /dev/null

          sudo chroot "$ROOTFS_DIR" /bin/bash -c "
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends \
              systemd-sysv dbus \
              xfce4 xfce4-terminal thunar xfce4-panel xfdesktop4 xfwm4 xfce4-settings \
              xfce4-whiskermenu-plugin xfce4-pulseaudio-plugin \
              lightdm lightdm-gtk-greeter \
              dbus-x11 polkitd \
              xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-video-fbdev \
              xvfb xwayland xauth x11-xserver-utils \
              mesa-utils glx-alternative-mesa \
              firefox-esr \
              sudo locales tzdata \
              git python3 python3-pip python3-venv \
              openssh-client openssh-server \
              nano vim-tiny curl wget
            useradd -m -s /bin/bash -G sudo,video,audio,render,plugdev cyber
            echo 'cyber:cyber' | chpasswd
            echo 'root:root' | chpasswd
            echo 'cyber ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/cyber
            sed -i 's/# en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
            locale-gen
            echo 'LANG=\"en_US.UTF-8\"' > /etc/default/locale
            ln -sf /usr/share/zoneinfo/UTC /etc/localtime
            echo 'UTC' > /etc/timezone
            systemctl disable bluetooth cups ModemManager avahi-daemon 2>/dev/null || true
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            rm -rf /usr/share/doc/*
            rm -rf /usr/share/man/*
            rm -rf /usr/share/locale/*
            find / -name '*.pyc' -delete 2>/dev/null
            find / -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          "

      - name: Copy XFCE and LightDM configurations
        run: |
          ROOTFS_DIR="${{ runner.temp }}/rootfs-build/rootfs-arm64"
          sudo mkdir -p "$ROOTFS_DIR/home/cyber/.config/xfce4/xfconf/xfce-perchannel-xml"
          sudo cp -r app/src/main/assets/xfce-config/* "$ROOTFS_DIR/home/cyber/.config/xfce4/"
          sudo mkdir -p "$ROOTFS_DIR/etc/lightdm"
          sudo cp -r app/src/main/assets/lightdm/* "$ROOTFS_DIR/etc/lightdm/"
          sudo chmod +x "$ROOTFS_DIR/etc/lightdm/*.sh"
          sudo chroot "$ROOTFS_DIR" chown -R cyber:cyber /home/cyber

      - name: Create rootfs tarball
        run: |
          mkdir -p ${{ runner.temp }}/artifacts
          cd ${{ runner.temp }}/rootfs-build
          tar -czf ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz rootfs-arm64
          ls -lh ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz
          retention-days: 7

      - name: Set outputs
        id: set-outputs
        run: |
          SIZE=$(stat -c%s ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz)
          echo "rootfs_path=${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz" >> $GITHUB_OUTPUT
          echo "rootfs_size=$SIZE" >> $GITHUB_OUTPUT

  build-proot:
    name: Cross-compile PRoot for ARM64 Android (NDK direct)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      proot_path: ${{ steps.set-outputs.outputs.proot_path }}
    steps:
      - name: Checkout PRoot source
        uses: actions/checkout@v4
        with:
          repository: proot-me/proot
          path: proot-src
          ref: v5.4.0

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 build-tools;34.0.0 platform-tools platforms;android-26'

      - name: Cross-compile PRoot with NDK clang
        run: |
          cd proot-src
          
          # Android NDK toolchain
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          TARGET="aarch64-linux-android"
          API=26
          
          export CC="${TOOLCHAIN}/bin/${TARGET}${API}-clang"
          export CXX="${TOOLCHAIN}/bin/${TARGET}${API}-clang++"
          export AR="${TOOLCHAIN}/bin/llvm-ar"
          export STRIP="${TOOLCHAIN}/bin/llvm-strip"
          export CFLAGS="--target=${TARGET}${API} -fPIE -pie -DANDROID -D__ANDROID_API__=26"
          export LDFLAGS="--target=${TARGET}${API} -fPIE -pie -static-libstdc++ -landroid -llog"
          
          # Build using the provided build script or cmake
          # proot uses cmake since v5.3.0
          mkdir -p build-android
          cd build-android
          
          cmake .. \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_STRIP="$STRIP" \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_SYSTEM_TALLOC=OFF \
            -DWITH_SYSTEM_LIBCap=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/proot-install"
          
          make -j$(nproc)
          make install
          
          # Copy to standard location
          mkdir -p ${{ runner.temp }}/proot-install/bin
          cp ${{ runner.temp }}/proot-install/bin/proot ${{ runner.temp }}/proot-install/bin/proot

      - name: Verify PRoot binary
        run: |
          file ${{ runner.temp }}/proot-install/bin/proot
          ${{ runner.temp }}/proot-install/bin/proot --version

      - name: Upload PRoot artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-android-arm64
          path: ${{ runner.temp }}/proot-install/bin/proot
          retention-days: 7

      - name: Set outputs
        id: set-outputs
        run: |
          echo "proot_path=${{ runner.temp }}/proot-install/bin/proot" >> $GITHUB_OUTPUT

  build-native:
    name: Build Native Libraries (JNI + Supervisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [build-proot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PRoot binary
        uses: actions/download-artifact@v4
        with:
          name: proot-android-arm64
          path: ${{ runner.temp }}/proot-bin

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 build-tools;34.0.0 platform-tools platforms;android-26'

      - name: Prepare PRoot for CMake
        run: |
          mkdir -p app/src/main/cpp/proot
          cp ${{ runner.temp }}/proot-bin/proot app/src/main/cpp/proot/
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.22.1)' \
            'project(proot-prebuilt)' \
            '' \
            'add_library(proot STATIC IMPORTED)' \
            'set_target_properties(proot PROPERTIES' \
            '  IMPORTED_LOCATION ${CMAKE_CURRENT_SOURCE_DIR}/proot' \
            '  IMPORTED_LINK_INTERFACE_LIBRARIES ""' \
            ')' > app/src/main/cpp/proot/CMakeLists.txt

      - name: Configure CMake for Android
        run: |
          cd app
          cmake -B build/arm64 -S src/main/cpp \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK=${ANDROID_NDK_HOME} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ANDROID_NDK_TOOLCHAIN_VERSION=clang

      - name: Build native libraries
        run: |
          cd app
          cmake --build build/arm64 -j$(nproc) --config Release

      - name: Verify native libraries
        run: |
          ls -la app/build/arm64/jniLibs/arm64-v8a/
          file app/build/arm64/jniLibs/arm64-v8a/liblinuxcyberdeck_jni.so

      - name: Upload native libraries artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-arm64
          path: app/build/arm64/jniLibs/arm64-v8a/*.so
          retention-days: 7

  assemble-apk:
    name: Assemble Final APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [build-rootfs, build-proot, build-native]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arm64
          path: app/src/main/assets

      - name: Download PRoot binary
        uses: actions/download-artifact@v4
        with:
          name: proot-android-arm64
          path: app/src/main/assets

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libs-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - name: Verify assets
        run: |
          ls -lh app/src/main/assets/
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 build-tools;34.0.0 platform-tools platforms;android-34'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          unzip -l app/build/outputs/apk/release/app-release.apk | head -30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cyberdeck-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false