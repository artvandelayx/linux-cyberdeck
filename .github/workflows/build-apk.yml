name: Build Linux Cyberdeck APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-cyberdeck-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '27.0.12077973'

jobs:
  rootfs:
    name: Debian 13 ARM64 rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install rootfs build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static ca-certificates

      - name: Build and configure Debian
        run: |
          set -euxo pipefail
          ROOTFS="${RUNNER_TEMP}/rootfs-arm64"
          MIRROR="https://deb.debian.org/debian"
          # Ubuntu 24.04's debootstrap predates Debian 13 and may not ship a
          # trixie suite alias yet.  Stable Debian suites use the generic sid
          # bootstrap script, so provide the same alias explicitly.
          if [ ! -e /usr/share/debootstrap/scripts/trixie ]; then
            test -e /usr/share/debootstrap/scripts/sid
            sudo ln -s sid /usr/share/debootstrap/scripts/trixie
          fi
          test -x /usr/bin/qemu-aarch64-static
          sudo debootstrap --arch=arm64 --foreign --variant=minbase trixie "$ROOTFS" "$MIRROR"
          sudo cp /usr/bin/qemu-aarch64-static "$ROOTFS/usr/bin/"
          sudo cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo chroot "$ROOTFS" /usr/bin/qemu-aarch64-static /debootstrap/debootstrap --second-stage
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$ROOTFS/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod 0755 "$ROOTFS/usr/sbin/policy-rc.d"

          sudo tee "$ROOTFS/etc/apt/sources.list" >/dev/null <<'EOF'
          deb https://deb.debian.org/debian trixie main
          deb https://deb.debian.org/debian trixie-updates main
          deb https://security.debian.org/debian-security trixie-security main
          EOF

          sudo chroot "$ROOTFS" /usr/bin/qemu-aarch64-static /bin/bash -euxo pipefail <<'EOF'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bash coreutils util-linux procps iproute2 iputils-ping \
            nano vim-tiny curl wget ca-certificates git \
            python3 python3-pip python3-venv \
            openssh-client openssh-server sudo locales tzdata \
            dbus dbus-x11 polkitd pkexec \
            xfce4 xfce4-terminal thunar xfce4-panel xfdesktop4 xfwm4 xfce4-settings \
            xfce4-whiskermenu-plugin \
            xvfb xauth x11-xserver-utils x11vnc novnc websockify \
            firefox-esr
          getent group audio >/dev/null || groupadd audio
          getent group video >/dev/null || groupadd video
          useradd -m -s /bin/bash -G sudo,audio,video cyber
          echo 'cyber ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/cyber
          chmod 0440 /etc/sudoers.d/cyber
          sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen
          printf 'LANG=en_US.UTF-8\n' >/etc/default/locale
          ln -sf /usr/share/zoneinfo/UTC /etc/localtime
          printf 'UTC\n' >/etc/timezone
          printf '127.0.0.1 localhost cyberdeck\n' >/etc/hosts
          printf 'cyberdeck\n' >/etc/hostname
          printf 'PasswordAuthentication no\nPermitRootLogin no\nListenAddress 127.0.0.1\n' >/etc/ssh/sshd_config.d/cyberdeck.conf
          apt-get clean
          rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
          rm -f /usr/sbin/policy-rc.d
          EOF

          sudo mkdir -p "$ROOTFS/home/cyber/.config/xfce4/xfconf/xfce-perchannel-xml"
          sudo mkdir -p "$ROOTFS/home/cyber/.config/xfce4/terminal"
          sudo cp app/src/main/assets/xfce-config/xfce4-panel/xfce4-panel.xml "$ROOTFS/home/cyber/.config/xfce4/xfconf/xfce-perchannel-xml/"
          sudo cp app/src/main/assets/xfce-config/xfwm4/xfwm4.xml "$ROOTFS/home/cyber/.config/xfce4/xfconf/xfce-perchannel-xml/"
          sudo cp app/src/main/assets/xfce-config/xsettings/xsettings.xml "$ROOTFS/home/cyber/.config/xfce4/xfconf/xfce-perchannel-xml/"
          sudo cp app/src/main/assets/xfce-config/xfce4-terminal/terminalrc "$ROOTFS/home/cyber/.config/xfce4/terminal/"
          sudo chroot "$ROOTFS" /usr/bin/qemu-aarch64-static chown -R cyber:cyber /home/cyber
          sudo rm -f "$ROOTFS/usr/bin/qemu-aarch64-static"

          test -x "$ROOTFS/bin/bash"
          test -x "$ROOTFS/usr/bin/startxfce4"
          test -x "$ROOTFS/usr/bin/firefox-esr"
          test -x "$ROOTFS/usr/bin/python3"

      - name: Package rootfs
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/artifacts"
          sudo tar --numeric-owner --xattrs --acls -I 'gzip -1' \
            -cf "${RUNNER_TEMP}/artifacts/rootfs-arm64.tar.gz" \
            -C "${RUNNER_TEMP}" rootfs-arm64
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/artifacts/rootfs-arm64.tar.gz"
          gzip -t "${RUNNER_TEMP}/artifacts/rootfs-arm64.tar.gz"
          ls -lh "${RUNNER_TEMP}/artifacts/rootfs-arm64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: ${{ runner.temp }}/artifacts/rootfs-arm64.tar.gz
          compression-level: 0
          retention-days: 7

  proot:
    name: Portable Android PRoot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and validate PRoot
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/proot"
          curl --fail --location --retry 5 \
            https://skirsten.github.io/proot-portable-android-binaries/aarch64/proot \
            -o "${RUNNER_TEMP}/proot/libproot.so"
          chmod 0755 "${RUNNER_TEMP}/proot/libproot.so"
          file "${RUNNER_TEMP}/proot/libproot.so" | tee /tmp/proot-file.txt
          grep -q 'ARM aarch64' /tmp/proot-file.txt
          if readelf -d "${RUNNER_TEMP}/proot/libproot.so" 2>/dev/null | grep -q NEEDED; then
            echo 'PRoot is dynamically linked; refusing a non-portable runtime.' >&2
            exit 1
          fi
          sha256sum "${RUNNER_TEMP}/proot/libproot.so"

      - uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: ${{ runner.temp }}/proot/libproot.so
          compression-level: 0
          retention-days: 7

  apk:
    name: Assemble installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [rootfs, proot]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rootfs-arm64
          path: app/src/main/assets

      - uses: actions/download-artifact@v4
        with:
          name: proot-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - name: Validate packaged inputs
        run: |
          set -euxo pipefail
          test -s app/src/main/assets/rootfs-arm64.tar.gz
          gzip -t app/src/main/assets/rootfs-arm64.tar.gz
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libproot.so
          test -x app/src/main/jniLibs/arm64-v8a/libproot.so
          file app/src/main/jniLibs/arm64-v8a/libproot.so | grep -q 'ARM aarch64'
          ls -lh app/src/main/assets/rootfs-arm64.tar.gz app/src/main/jniLibs/arm64-v8a/libproot.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'

      - name: Build signed debug APK
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          cp app/build/outputs/apk/debug/app-debug.apk linux-cyberdeck.apk

      - name: Verify APK contents and signature
        run: |
          set -euxo pipefail
          apksigner verify --verbose linux-cyberdeck.apk
          unzip -l linux-cyberdeck.apk | grep -q 'assets/rootfs-arm64.tar.gz'
          unzip -l linux-cyberdeck.apk | grep -q 'lib/arm64-v8a/libproot.so'
          unzip -l linux-cyberdeck.apk | grep -q 'lib/arm64-v8a/liblinuxcyberdeck_jni.so'
          sha256sum linux-cyberdeck.apk | tee linux-cyberdeck.apk.sha256
          ls -lh linux-cyberdeck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cyberdeck-apk
          path: |
            linux-cyberdeck.apk
            linux-cyberdeck.apk.sha256
          compression-level: 0
          retention-days: 30
